[project]
name = "atlas-api"
version = "0.1.0"
description = "API ATLAS 2050 : estimation et décote climatique des logements"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.27,<1",
  # modèle de prix du sprint 3 (SavedModel, voisinage, projection) : jamais dupliqué
  "atlas-pipelines[ml]",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas_api = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: PostGIS réel (ignoré si la base est injoignable)"]
addopts = "--cov=atlas_api --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["atlas_pipelines.*", "lightgbm.*", "h3.*", "shap.*", "pandas.*"]
ignore_missing_imports = true
