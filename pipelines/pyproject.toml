[project]
name = "atlas-pipelines"
version = "0.1.0"
description = "Ingestion Open Data et nettoyage ATLAS 2050"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "duckdb>=1.1,<2",
  "pyarrow>=17",
  "py7zr>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<3.6"]
ml = [
  "pandas>=2.2,<3",
  "h3>=4,<5",
  "scikit-learn>=1.5,<1.8",
  "lightgbm>=4.5,<5",
  "optuna>=4,<5",
  "shap>=0.46,<0.49",
  "mlflow-skinny>=2.17,<3",
  "matplotlib>=3.8,<4",
]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas_pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=atlas_pipelines --cov-report=term-missing --cov-fail-under=80"
markers = ["spark: nécessite Java + PySpark", "network: appelle les vraies API"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["dags/"]
